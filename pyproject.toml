[project]
name = "valeur-marchande"
version = "0.1.0"
description = "Projet Python pour la data science (ENSAE) : valeur marchande des joueurs de football et note EA FC 27"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pyarrow>=17.0.0",
    "matplotlib>=3.8",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12",
    "kagglehub>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
